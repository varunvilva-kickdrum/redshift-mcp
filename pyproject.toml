[project]
name = "redshift-mcp"
version = "0.1.0"
description = "Read-only MCP server for Amazon Redshift (Claude Desktop / Cursor)."
readme = "README.md"
authors = [
    { name = "varunvilva-kickdrum", email = "varun.vilvadrinath@kickdrumtech.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.0",
    "cachetools>=6.2.4",
    "cryptography>=46.0.3",
    "mangum>=0.21.0",
    "mcp[cli]>=1.27.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.2.2",
    "redshift-connector>=2.1.13",
    "sqlglot>=30.7.0",
]

[project.scripts]
redshift-mcp = "redshift_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.6,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
